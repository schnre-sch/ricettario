<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Ricettario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f1; --surface: #ffffff; --surface-2: #f0ebe5; --text: #231d18; --muted: #8a8178;
    --wood: #7a4f33; --wood-dark: #4f3322; --wood-light: #c4a07c; --wood-soft: #f3ebe2;
    --olive: #66735a; --border: #e5dfd8; --danger: #a33a2b;
    --c-Antipasti: #c4a07c; --c-Primi: #9a6a45; --c-Secondi: #6b4429; --c-Dolci: #d9bf9f; --c-Altro: #a59a90;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px; }
  h1, h2, h3 { font-weight: 600; letter-spacing: -.02em; }
  h1 { font-size: 1.9rem; margin: 10px 0 4px; }
  h2 { font-size: 1.75rem; margin: 4px 0 6px; line-height: 1.15; }
  h3 { font-size: .75rem; margin: 0 0 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .view { animation: enter .28s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .view, .card { animation: none !important; } * { transition: none !important; } }

  .ic { width: 20px; height: 20px; flex-shrink: 0; vertical-align: middle; }
  .ic.fill { fill: currentColor; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 11px 12px; width: 100%; transition: border-color .2s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--wood); }
  textarea { min-height: 100px; resize: vertical; }
  button, .btn { font: inherit; font-size: .95rem; border: 1px solid var(--border); border-radius: 8px; padding: 11px 16px; cursor: pointer;
    background: var(--surface); color: var(--text); transition: background .2s, transform .1s; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; text-decoration: none; font-weight: 500; }
  button:active, .btn:active { transform: scale(.97); }
  .primary { background: var(--wood); border-color: var(--wood); color: #fff; }
  .primary:hover { background: var(--wood-dark); }
  .ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .danger { background: transparent; color: var(--danger); border-color: var(--danger); }
  .small { padding: 8px 12px; font-size: .88rem; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  .topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .iconbtn { width: 42px; height: 42px; padding: 0; color: var(--text); }
  .iconbtn.on { color: var(--wood); }

  .search { position: relative; }
  .search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search input { padding-left: 40px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 7px 14px; border-radius: 999px; font-size: .88rem; }
  .chip.on { background: var(--text); color: #fff; border-color: var(--text); }

  .grid { display: grid; gap: 10px; margin-top: 14px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px 14px 18px; cursor: pointer;
    position: relative; overflow: hidden; transition: border-color .2s, transform .12s; animation: enter .3s both; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--cc); }
  .card:hover { border-color: var(--wood-light); }
  .card:active { transform: scale(.99); }
  .card .cat { font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .card .t { font-weight: 600; font-size: 1.05rem; margin: 2px 0; display: flex; align-items: center; gap: 6px; }
  .card .t .ic { width: 16px; height: 16px; color: var(--wood); }
  .meta { color: var(--muted); font-size: .88rem; }
  .empty { text-align: center; color: var(--muted); padding: 56px 12px; border: 1px dashed var(--border); border-radius: 10px; margin-top: 14px; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-top: 12px; }
  .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .12em; color: var(--wood); font-weight: 600; }

  .stepper { display: flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 8px; }
  .stepper button { width: 42px; height: 40px; padding: 0; border: 0; font-size: 1.2rem; color: var(--wood); background: transparent; }
  .stepper b { font-size: 1.1rem; min-width: 30px; text-align: center; }

  .tabsel { display: flex; border-bottom: 1px solid var(--border); margin-top: 18px; }
  .tabsel button { flex: 1; border: 0; border-radius: 0; background: transparent; color: var(--muted); padding: 12px 6px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabsel button.on { color: var(--text); border-bottom-color: var(--wood); font-weight: 600; }

  .ing { list-style: none; padding: 0; margin: 0; }
  .ing li { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
  .ing li:last-child { border-bottom: 0; }
  .ing .q { font-weight: 600; min-width: 78px; }
  .ing .k { margin-left: auto; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .swap { display: block; color: var(--olive); font-size: .82rem; }
  .total { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 12px; padding: 12px 14px;
    border-radius: 8px; background: var(--wood-soft); color: var(--wood-dark); font-weight: 600; }
  .note-unknown { font-size: .82rem; color: var(--muted); margin-top: 8px; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { border: 1px solid var(--border); padding: 5px 12px; border-radius: 999px; font-size: .9rem; }
  ol.steps { padding: 0; margin: 0; list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 16px 40px; }
  ol.steps li::before { content: counter(s, decimal-leading-zero); position: absolute; left: 0; top: 0; font-weight: 700;
    color: var(--wood-light); font-size: .95rem; }
  .bset { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bset span { font-size: .8rem; border: 1px solid var(--wood-light); color: var(--wood); padding: 2px 9px; border-radius: 4px; font-weight: 500; }

  label { display: block; font-weight: 600; margin: 18px 0 6px; font-size: .92rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .irow { display: grid; grid-template-columns: 74px 112px 1fr 36px; gap: 6px; margin-bottom: 6px; animation: enter .2s; }
  .irow .x, .brow .x { padding: 0; border: 0; background: transparent; color: var(--muted); }
  @media (max-width: 420px) { .irow { grid-template-columns: 60px 98px 1fr 30px; } .irow input, .irow select { padding: 10px 8px; } }
  .section { border-top: 1px solid var(--border); margin-top: 26px; padding-top: 4px; }
  .brow { border: 1px solid var(--border); border-left: 3px solid var(--wood-light); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: var(--surface); animation: enter .2s; }
  .brow textarea { min-height: 54px; }
  .brow .three { display: grid; grid-template-columns: 1fr 1fr 1fr 36px; gap: 6px; margin-top: 6px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }

  .fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 6;
    width: 56px; height: 56px; border-radius: 14px; padding: 0; background: var(--wood); border-color: var(--wood); color: #fff;
    box-shadow: 0 6px 18px rgba(79,51,34,.25); }
  .fab .ic { width: 26px; height: 26px; }

  .shop { list-style: none; margin: 0; padding: 0; }
  .shop li { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .25s; }
  .shop li:last-child { border-bottom: 0; }
  .shop .box { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--wood-light); display: grid; place-items: center;
    flex-shrink: 0; transition: background .2s; color: transparent; }
  .shop .box .ic { width: 15px; height: 15px; }
  .shop li.done { opacity: .45; }
  .shop li.done .box { background: var(--wood); border-color: var(--wood); color: #fff; }
  .shop li.done .t { text-decoration: line-through; }
  .shop .t { flex: 1; }
  .shop .qq { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .progress { height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
  .progress div { height: 100%; background: var(--wood); transition: width .4s; }
  .done-banner { background: var(--wood-soft); border-color: var(--wood-light); }

  .members { list-style: none; margin: 8px 0 10px; padding: 0; }
  .members li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
  .members .x { padding: 0; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); }
  .illus { color: var(--wood-light); display: block; }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .deco { display: flex; gap: 6px; margin-bottom: 14px; }
  .deco .illus { width: 34px; height: 34px; animation: float 5s ease-in-out infinite; }
  .deco .illus:nth-child(2) { animation-delay: -1.2s; } .deco .illus:nth-child(3) { animation-delay: -2.4s; } .deco .illus:nth-child(4) { animation-delay: -3.6s; }
  @keyframes float { 50% { transform: translateY(-3px) rotate(-4deg); } }
  @media (max-width: 340px) { .deco .illus:nth-child(n+3) { display: none; } }
  .card .wm { position: absolute; right: -8px; bottom: -10px; width: 70px; height: 70px; opacity: .22; transition: transform .3s; }
  .card:hover .wm { transform: rotate(-8deg) scale(1.05); }
  .card > div:not(.wm) { position: relative; padding-right: 44px; }
  .detail-ill { width: 64px; height: 64px; flex-shrink: 0; opacity: .7; }
  .empty .illus { width: 72px; height: 72px; margin: 0 auto 12px; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--wood-light); margin: 26px 0 0; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .divider .illus { width: 26px; height: 26px; }
  .stars { display: flex; gap: 2px; margin-top: 10px; align-items: center; }
  .stars button { width: 36px; height: 36px; padding: 0; border: 0; background: transparent; color: var(--wood-light); }
  .stars button .ic { width: 26px; height: 26px; }
  .stars button.on { color: var(--wood); }
  .stars button.pop .ic { animation: pop .35s ease-out; }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .stars .muted { font-size: .85rem; margin-left: 6px; }
  .mini-stars { color: var(--wood); display: inline-flex; gap: 1px; vertical-align: -2px; }
  .mini-stars .ic { width: 13px; height: 13px; }
  .mini-stars .ic:not(.fill) { color: var(--wood-light); }
  .mlist label { display: flex; gap: 10px; align-items: center; font-weight: 400; margin: 0; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .mlist input { width: 20px; height: 20px; accent-color: var(--wood); }
  .group { margin-top: 14px; }
  .course { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .course:last-child { border-bottom: 0; }
  .course .mark { width: 4px; align-self: stretch; border-radius: 2px; background: var(--cc); }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--border);
    display: flex; justify-content: center; padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; max-width: 160px; border: 0; background: transparent; flex-direction: column; gap: 3px;
    font-size: .72rem; color: var(--muted); padding: 8px 4px; position: relative; border-radius: 0; }
  nav.tabs button .ic { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--wood); font-weight: 600; }
  nav.tabs button.on::before { content: ""; position: absolute; top: -5px; left: 30%; right: 30%; height: 2px; background: var(--wood); }
  .count { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--wood); color: #fff; font-size: .65rem; font-style: normal;
    min-width: 17px; height: 17px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: calc(150px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(16px);
    background: var(--wood-dark); color: #fff; padding: 10px 18px; border-radius: 8px; font-size: .9rem; opacity: 0;
    pointer-events: none; transition: all .3s; z-index: 9; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main id="view" class="wrap"></main>
<nav class="tabs" id="tabs"></nav>
<div class="toast" id="toast"></div>

<script>
// ---------- Icone ----------

const ic = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

// ---------- Dati di base ----------
const KEY = "ricettario.v2", OLD_KEY = "ricettario.v1";
const CATS = ["Antipasti", "Primi", "Secondi", "Dolci"];
const UNITS = [["g","g"],["kg","kg"],["ml","ml"],["l","l"],["pz","pezzi"],["cucchiaio","cucchiai"],["cucchiaino","cucchiaini"],

// Calorie per 100 g (valori medi). Formato: "nomi alternativi", kcal, grammi per pezzo

  ["yogurt greco 0|yogurt greco magro",57],["yogurt greco",97],["yogurt magro",36],["yogurt",61],["skyr",63],
  ["mascarpone",455],["ricotta light",90],["ricotta",146],["mozzarella light",160],["mozzarella|fior di latte",253],
  ["parmigiano|grana",390],["pecorino",387],["formaggio spalmabile light|philadelphia light",140],["formaggio spalmabile|philadelphia",250],
  ["stracchino|crescenza",300],["scamorza|provola",330],["gorgonzola",330],["fontina",343],
  ["albume|albumi",52,33],["tuorl",325,18],["uov",143,55],

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return { recipes: [], menus: [], shop: [], settings: {}, ...JSON.parse(raw) };
    const old = localStorage.getItem(OLD_KEY); // versione precedente: la converto, l'originale resta intatto
    if (old) return { recipes: JSON.parse(old).map(migrate), menus: [], shop: [], settings: {} };
  } catch (e) {}
  return { recipes: [], menus: [], shop: [], settings: {} };
}
// Aggiunge le ricette di esempio una volta sola: se poi le elimini, non tornano
function addExamples(d) {
  const EXAMPLES_VERSION = 2;
  if ((d.settings.examples || 0) >= EXAMPLES_VERSION) return d;
  const titles = new Set(d.recipes.map(r => norm(r.title)));
  for (const r of examples()) if (!d.recipes.some(x => x.id === r.id) && !titles.has(norm(r.title))) d.recipes.push(r);
  d.settings.examples = EXAMPLES_VERSION;
  return d;
}
// Aggiunge le ricette del quaderno una volta sola: se poi le elimini, non tornano
function addQuaderno(d) {
  if (d.settings.quaderno) return d;
  const titles = new Set(d.recipes.map(r => norm(r.title)));
  for (const r of QUADERNO) if (!d.recipes.some(x => x.id === r.id) && !titles.has(norm(r.title))) d.recipes.push(migrate(r));
  d.settings.quaderno = 1;
  return d;
}

function saveLocal() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); }

function migrate(r) {
  return {
    id: r.id || uid(), title: r.title || "Senza nome", cat: r.cat || "Primi", time: r.time || "",
    serv: parseInt(r.serv) || 4, fav: !!r.fav, stars: Math.min(5, parseInt(r.stars) || 0), notes: r.notes || "",
    ing: (r.ing || []).map(x => typeof x === "string" ? parseLine(x) : x),
    tools: r.tools || [], steps: r.steps || [], bimby: r.bimby || []
  };
}

// ---------- Ingredienti, porzioni e calorie ----------
function parseLine(s) {
  s = s.trim();
  const qb = /\s*\bq\.?\s?b\.?\s*$/i;
  if (qb.test(s)) return { qty: null, unit: "qb", name: s.replace(qb, "").trim() || s };
  const t = s.split(/\s+/);
  let qty = null, unit = "qb";
  const m = t[0] && t[0].match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)([a-zA-Z]*)$/);
  if (m) {
    qty = toNum(m[1]); unit = "pz"; t.shift();
    if (m[2]) t.unshift(m[2]);
    const w = t.length > 1 ? norm(t[0]).replace(/\.$/, "") : "";
    if (UNIT_WORDS[w]) { unit = UNIT_WORDS[w]; t.shift(); if (unit === "cl") { unit = "ml"; qty *= 10; } }
  }
  const name = t.join(" ").replace(/^di\s+/i, "").replace(/^d['’]\s*/i, "");
  return { qty, unit: qty == null ? "qb" : unit, name: name || s };
}
function toNum(v) {
  v = String(v ?? "").replace(",", ".").trim();
  if (!v) return null;
  const n = v.includes("/") ? v.split("/")[0] / v.split("/")[1] : parseFloat(v);
  return isFinite(n) && n > 0 ? n : null;
}
function findFood(name) {
  const n = norm(name); let best = null, bl = 0;
  for (const f of FOOD) for (const p of f.pats) if (p.length > bl && n.includes(p)) { best = f; bl = p.length; }
  return best;
}
function kcalOf(i) {
  if (i.unit === "qb") return 0;
  const f = findFood(i.name);
  if (!f || !(i.qty > 0)) return null;
  if (!f.kcal) return 0;
  const g = i.unit === "pz" ? (f.pz ? i.qty * f.pz : null) : i.qty * (UNIT_G[i.unit] ?? 1);
  return g == null ? null : g * f.kcal / 100;
}
function applyVer(i, ver) {
  if (ver === "orig" || i.unit === "qb") return { ...i };
  const f = findFood(i.name), s = f && SUBS[f.id] && SUBS[f.id][ver];
  if (!s || (!s.to && i.qty == null)) return { ...i };
  const o = { ...i };
  if (s.to) { o.name = s.to; o.was = i.name; }
  if (s.f && s.f !== 1 && o.qty != null) { o.qty = i.qty * s.f; o.reduced = true; }
  return o;
}
function scaled(r, persons, ver) {
  const k = persons / (r.serv || persons);
  return r.ing.map(i => { const o = applyVer(i, ver); if (o.qty != null) o.qty *= k; return o; });
}
function kcalSum(list) {
  let total = 0, unknown = 0;
  for (const i of list) { const k = kcalOf(i); if (k == null) unknown++; else total += k; }
  return { total, unknown };
}
const perPerson = r => Math.round(kcalSum(r.ing).total / (r.serv || 1));
function fmtQty(q) {
  if (q == null) return "";
  const v = q >= 100 ? Math.round(q / 5) * 5 : q >= 10 ? Math.round(q) : q >= 1 ? Math.round(q * 10) / 10 : Math.round(q * 100) / 100;
  return String(v).replace(".", ",");
}
// Nel modulo di modifica la quantità resta esatta (niente arrotondamenti che cambierebbero la ricetta)
const exactQty = q => q == null ? "" : String(Math.round(q * 100) / 100).replace(".", ",");
function fmtAmount(i) {
  if (i.unit === "qb" || i.qty == null) return "q.b.";
  const u = i.unit === "pz" ? "" : (i.qty > 1 && PLURAL[i.unit]) || i.unit;
  return (fmtQty(i.qty) + " " + u).trim();
}
const catOrder = c => { const n = CATS.indexOf(c); return n < 0 ? 99 : n; };

}

// ---------- Lista della spesa ----------
function addToShop(list, from) {
  let n = 0;
  for (const i of list) {
    const key = norm(i.name) + "|" + i.unit;
    const ex = db.shop.find(x => norm(x.name) + "|" + x.unit === key && !x.done);
    if (ex) { if (ex.qty != null && i.qty != null) ex.qty += i.qty; }
    else db.shop.push({ id: uid(), name: i.name, qty: i.qty, unit: i.unit, done: false, from });
    n++;
  }
  save(); render(false); toast(`${n} ingredienti aggiunti alla spesa`);
}
function phoneDigits(p) {
  let s = String(p || "").replace(/[^\d+]/g, "");
  if (s.startsWith("+")) s = s.slice(1); else if (s.startsWith("00")) s = s.slice(2); else if (/^3\d{8,9}$/.test(s)) s = "39" + s;
  return s.replace(/\D/g, "");
}
// Link vero (non una finestra aperta dal programma): i telefoni non lo bloccano
function waHref() {
  const all = db.shop.length && db.shop.every(x => x.done);
  const txt = (all ? "Spesa fatta:\n" : "Lista della spesa:\n") +
    [...db.shop].sort((a, b) => a.done - b.done).map(x => `${x.done ? "✓" : "•"} ${x.name}${x.qty == null ? "" : " — " + fmtAmount(x)}`).join("\n");
  return `https://wa.me/${phoneDigits(db.settings.phone)}?text=${encodeURIComponent(txt)}`;
}
const waButton = () => `<a class="btn primary" href="${esc(waHref())}" target="_blank" rel="noopener">${ic("chat")} Invia su WhatsApp</a>`;
function viewShop() {
  const items = [...db.shop].sort((a, b) => a.done - b.done);
  const done = db.shop.filter(x => x.done).length;
  const all = items.length && done === items.length;
  return `<h1>Spesa</h1>
    ${items.length ? `<p class="sub" style="margin-bottom:0">${done} di ${items.length} presi</p>
      <div class="progress"><div style="width:${done / items.length * 100}%"></div></div>
      ${all ? `<div class="panel done-banner"><b>Spesa completata.</b><p class="muted" style="margin:4px 0 12px">Invia la lista: si apre WhatsApp con il messaggio già scritto, tu tocchi solo Invia.</p>${waButton()}</div>` : ""}
      <div class="panel"><ul class="shop">${items.map(x => `
        <li class="${x.done ? "done" : ""}" data-act="check" data-id="${x.id}"><span class="box">${ic("check")}</span>
          <span class="t">${esc(x.name)}${x.from ? `<div class="meta">${esc(x.from)}</div>` : ""}</span><span class="qq">${x.qty == null ? "" : esc(fmtAmount(x))}</span></li>`).join("")}</ul></div>
      <div class="bar">${all ? "" : waButton()}<button data-act="clearDone">Togli i presi</button><button class="ghost" data-act="clearAll">Svuota</button></div>
      ${db.settings.phone ? "" : `<p class="muted" style="font-size:.88rem">Nessun numero impostato: WhatsApp ti farà scegliere il contatto. Puoi impostarlo in Altro.</p>`}`
    : `<div class="empty">${ill("tagliere")}La lista è vuota.<br>Apri una ricetta o un menu e tocca "Aggiungi alla spesa".</div>`}
    <div class="panel"><h3>Aggiungi a mano</h3><div class="row"><input id="shopAdd" placeholder="Es. 1 kg pane" style="flex:1;width:auto">
      <button data-act="shopAdd" aria-label="Aggiungi">${ic("plus")}</button></div></div>`;
}

// ---------- Impostazioni ----------
function viewSettings() {
  return `<h1>Altro</h1><p class="sub">Impostazioni e copie di sicurezza.</p>
    <div class="panel"><h3>Famiglia</h3>${familyPanel()}</div>
    <div class="panel"><h3>Numero WhatsApp per la spesa</h3>
      <p class="muted" style="margin-top:0">La lista della spesa verrà preparata per questo numero. Se lo lasci vuoto, WhatsApp ti farà scegliere il contatto.</p>
      <input id="phone" data-in="phone" type="tel" placeholder="Es. +39 333 1234567" value="${esc(db.settings.phone)}"></div>
    <div class="panel"><h3>Copia di sicurezza</h3>
      <p class="muted" style="margin-top:0">${cloud.status === "member" ? "Le ricette sono salvate online per tutta la famiglia. Puoi comunque scaricare una copia da tenere." : "Le ricette sono salvate su questo dispositivo. Scarica ogni tanto una copia: serve anche per spostarle su un altro telefono o computer."}</p>
      <div class="row"><button data-act="export">Scarica copia</button><button data-act="import">Carica copia</button></div>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden"></div>
    <p class="muted" style="text-align:center;font-size:.82rem;margin-top:20px">Le calorie sono stime medie, da usare come indicazione.</p>`;
}
function exportData() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "ricettario", version: 2, ...db }, null, 2)], { type: "application/json" }));
  a.download = `ricettario-${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importData(f) {
  try {
    const data = JSON.parse(await f.text());
    const rs = (Array.isArray(data) ? data : data.recipes || []).filter(r => r && r.title).map(migrate);
    const ms = Array.isArray(data) ? [] : (data.menus || []);
    if (!rs.length && !ms.length) throw 0;
    if (!confirm(`Trovate ${rs.length} ricette e ${ms.length} menu. Le aggiungo a quelle che hai già?`)) return;
    const ids = new Set(db.recipes.map(r => r.id)), mids = new Set(db.menus.map(m => m.id));
    const newR = rs.filter(r => !ids.has(r.id)), newM = ms.filter(m => m && m.id && !mids.has(m.id));
    db.recipes.push(...newR); db.menus.push(...newM);
    save(); render(false); toast(`Aggiunte ${newR.length} ricette e ${newM.length} menu`);
  } catch { toast("Questo file non sembra una copia del ricettario"); }
}

// ---------- Condivisione con la famiglia (Firebase) ----------
// Online: ricette/{id}, menu/{id}, condivisi/spesa, config/accesso (chi può entrare)
const FB_URL = "https://www.gstatic.com/firebasejs/10.12.2/firebase-";
const BASE_KEY = "ricettario.v2.base";
const cloud = { status: "off", user: null, access: null, A: null, F: null, auth: null, fs: null, unsub: [] };
// Ultima versione vista online: serve a capire cosa è cambiato su questo dispositivo
let remote = (() => { try { return JSON.parse(localStorage.getItem(BASE_KEY)); } catch { return null; } })();
const saveBase = () => { try { localStorage.setItem(BASE_KEY, JSON.stringify(remote)); } catch {} };
// Testo con le chiavi in ordine fisso, per confrontare due versioni
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.entries(x).sort()) : x);
const snapOf = list => Object.fromEntries(list.map(x => [x.id, canon(x)]));

async function readConfig() {
  try {
    const t = await (await fetch("firebase-config.txt", { cache: "no-store" })).text();
    const c = {};
    for (const k of ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"]) {
      const m = t.match(new RegExp(k + "\\s*:\\s*[\"']([^\"']+)[\"']"));
      if (m) c[k] = m[1];
    }
    if (!(c.apiKey && c.projectId && c.appId)) return null;
    c.authDomain ||= c.projectId + ".firebaseapp.com";
    return c;
  } catch { return null; }
}
async function cloudInit(cfg) {
  cfg = cfg || await readConfig();
  if (!cfg) return;
  setStatus("loading");
  try {
    const [app, A, F] = await Promise.all(["app", "auth", "firestore"].map(n => import(FB_URL + n + ".js")));
    const a = app.initializeApp(cfg);
    Object.assign(cloud, { A, F, auth: A.getAuth(a), fs: F.initializeFirestore(a, { ignoreUndefinedProperties: true }) });
    A.onAuthStateChanged(cloud.auth, u => { cloud.user = u; stopSync(); u ? connect() : setStatus("signedOut"); });
  } catch (e) { setStatus("offline"); }
}
function setStatus(s) { cloud.status = s; refresh(); }
// Ridisegna senza disturbare chi sta scrivendo
function refresh() {
  const a = document.activeElement;
  if (["edit", "menuEdit"].includes(state.view) || (a && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return;
  render(false);
}
async function connect() {
  const F = cloud.F;
  setStatus("loading");
  try {
    const acc = await F.getDoc(F.doc(cloud.fs, "config", "accesso"));
    if (!acc.exists()) return setStatus("noFamily");
    cloud.access = acc.data();
    await startSync();
  } catch (e) { setStatus(e.code === "permission-denied" ? "denied" : "offline"); }
}
async function startSync() {
  const F = cloud.F, fs = cloud.fs, uidNow = cloud.user.uid;
  const [rs, ms, sp] = await Promise.all([F.getDocs(F.collection(fs, "ricette")), F.getDocs(F.collection(fs, "menu")), F.getDoc(F.doc(fs, "condivisi", "spesa"))]);
  const server = { recipes: rs.docs.map(d => d.data()), menus: ms.docs.map(d => d.data()), shop: sp.exists() ? sp.data().items || [] : [] };
  const first = db.settings.cloudUser !== uidNow || !remote;
  db.recipes = mergeList(server.recipes, db.recipes, first ? null : remote.recipes, true);
  db.menus = mergeList(server.menus, db.menus, first ? null : remote.menus, false);
  if (first) db.shop = [...server.shop, ...db.shop.filter(x => !server.shop.some(s => s.id === x.id))];
  else if (canon(db.shop) === remote.shop) db.shop = server.shop; // altrimenti vince la lista modificata qui
  remote = { recipes: snapOf(server.recipes), menus: snapOf(server.menus), shop: canon(server.shop) };
  db.settings.cloudUser = uidNow;
  cloud.status = "member";
  save(); // manda online quello che è cambiato su questo dispositivo
  listen(); refresh();
}
// Unisce le ricette online con quelle di questo dispositivo
function mergeList(server, local, base, byTitle) {
  const out = new Map(server.map(x => [x.id, x]));
  if (!base) { // prima volta su questo dispositivo: aggiungo solo ciò che online manca
    const titles = new Set(byTitle ? server.map(x => norm(x.title)) : []);
    for (const x of local) if (!out.has(x.id) && !titles.has(norm(x.title)) && !(x.id.startsWith("ex-") && server.length)) out.set(x.id, x);
  } else {
    for (const x of local) if (canon(x) !== base[x.id]) out.set(x.id, x); // modificate qui
    for (const id in base) if (!local.some(x => x.id === id)) out.delete(id); // eliminate qui
  }
  return [...out.values()];
}
function listen() {
  const F = cloud.F, fs = cloud.fs;
  const fail = e => { stopSync(); setStatus(e.code === "permission-denied" ? "denied" : "offline"); };
  const apply = (key, data) => {
    db[key] = data; remote[key] = key === "shop" ? canon(data) : snapOf(data);
    saveBase(); saveLocal(); refresh();
  };
  cloud.unsub = [
    F.onSnapshot(F.collection(fs, "ricette"), q => apply("recipes", q.docs.map(d => d.data())), fail),
    F.onSnapshot(F.collection(fs, "menu"), q => apply("menus", q.docs.map(d => d.data())), fail),
    F.onSnapshot(F.doc(fs, "condivisi", "spesa"), d => apply("shop", d.exists() ? d.data().items || [] : []), fail),
    F.onSnapshot(F.doc(fs, "config", "accesso"), d => { cloud.access = d.data() || {}; if (state.view === "settings") refresh(); }, fail)
  ];
}
function stopSync() { cloud.unsub.forEach(f => f()); cloud.unsub = []; }
// Manda online solo le cose cambiate
function push() {
  if (cloud.status !== "member") return;
  const F = cloud.F, fs = cloud.fs, b = F.writeBatch(fs);
  let n = 0;
  for (const [key, col] of [["recipes", "ricette"], ["menus", "menu"]]) {
    const map = remote[key];
    for (const x of db[key]) { const s = canon(x); if (map[x.id] !== s) { b.set(F.doc(fs, col, x.id), x); map[x.id] = s; n++; } }
    for (const id of Object.keys(map)) if (!db[key].some(x => x.id === id)) { b.delete(F.doc(fs, col, id)); delete map[id]; n++; }
  }
  const s = canon(db.shop);
  if (remote.shop !== s) { b.set(F.doc(fs, "condivisi", "spesa"), { items: db.shop }); remote.shop = s; n++; }
  if (!n) return;
  saveBase();
  b.commit().catch(() => toast("Modifica non salvata online: controlla la connessione"));
}
function setMembers(list) {
  const F = cloud.F;
  return F.updateDoc(F.doc(cloud.fs, "config", "accesso"), { email: list }).catch(() => toast("Non riesco a salvare: riprova"));
}
function familyPanel() {
  const u = cloud.user, a = cloud.access || {}, me = u ? `<b>${esc(u.email)}</b>` : "";
  const out = `<button class="small ghost" data-act="logout">Esci</button>`;
  const p = t => `<p class="muted" style="margin-top:0">${t}</p>`;
  switch (cloud.status) {
    case "off": return p("La condivisione non è ancora attiva.");
    case "loading": return p("Collegamento in corso…");
    case "offline": return p("Non riesco a collegarmi. Le modifiche restano su questo dispositivo e si uniscono a quelle della famiglia quando torni online.");
    case "signedOut": return p("Entra con il tuo account Google per avere ricette, menu e spesa in comune con tutta la famiglia.") +
      `<button class="primary" data-act="login">Entra con Google</button>`;
    case "noFamily": return p(`Sei entrato come ${me}. Il ricettario di famiglia non esiste ancora: crealo e potrai invitare gli altri. Le ricette di questo dispositivo verranno copiate dentro.`) +
      `<div class="row"><button class="primary" data-act="createFamily">Crea il ricettario di famiglia</button>${out}</div>`;
    case "denied": return p(`L'account ${me} non fa ancora parte della famiglia. Chiedi a chi ha creato il ricettario di aggiungerlo da Altro, sezione Famiglia.`) + out;
  }
  const owner = a.proprietario === u.uid;
  return p(`Collegato come ${me}. Ricette, menu e spesa sono in comune con la famiglia.`) +
    (owner ? `<div class="label">Chi può entrare</div>
      <ul class="members">${(a.email || []).map(e => `<li><span class="grow">${esc(e)}</span>${e === a.proprietarioEmail ? `<span class="muted">tu</span>`
        : `<button class="x" data-act="delMember" data-e="${esc(e)}" aria-label="Togli">${ic("x")}</button>`}</li>`).join("")}</ul>
      <div class="row"><input id="memberEmail" type="email" placeholder="Email Google di un familiare" style="flex:1;width:auto">
        <button data-act="addMember" aria-label="Aggiungi">${ic("plus")}</button></div>` : "") +
    `<div class="row" style="margin-top:12px">${out}</div>`;
}

// ---------- Azioni ----------
const actions = {
  tab: b => go(b.dataset.v, { persons: null }),
  back,
  cat: b => { state.cat = b.dataset.c; render(false); },
  newRecipe: () => go("edit", { rid: null }),
  openRecipe: b => go("detail", { rid: b.dataset.id, persons: null, ver: "orig", proc: "std" }),
  editRecipe: () => go("edit", { rid: state.rid }),
  editBimby: () => go("edit", { rid: state.rid, focus: "bimby" }),
  fav: () => { const r = getR(state.rid); r.fav = !r.fav; save(); render(false); },
  // Tocca la stessa stella di nuovo per togliere il voto
  rate: b => {
    const r = getR(state.rid), n = +b.dataset.n;
    r.stars = r.stars === n ? 0 : n; save(); render(false);
    document.querySelectorAll(".stars button").forEach((x, i) => i < r.stars && x.classList.add("pop"));
  },
  pers: b => {
    const base = state.view === "menu" ? getM(state.mid).serv : getR(state.rid).serv;
    state.persons = Math.max(1, Math.min(50, (state.persons || base) + +b.dataset.d));
    history.replaceState({ ...history.state, persons: state.persons }, ""); render(false);
  },
  ver: b => { state.ver = b.dataset.v; history.replaceState({ ...history.state, ver: state.ver }, ""); render(false); },
  proc: b => { state.proc = b.dataset.v; history.replaceState({ ...history.state, proc: state.proc }, ""); render(false); },
  addShop: () => { const r = getR(state.rid); addToShop(scaled(r, state.persons || r.serv, state.ver), r.title); },
  addRow: () => { $("ingRows").insertAdjacentHTML("beforeend", ingRow()); $("ingRows").lastElementChild.querySelector(".iq").focus(); },
  delRow: b => b.closest(".irow").remove(),
  toggleQuick: () => $("quick").classList.toggle("hidden"),
  addQuick: () => {
    const ls = lines($("quickText").value); if (!ls.length) return;
    document.querySelectorAll("#ingRows .irow").forEach(row => { if (!row.querySelector(".in").value.trim()) row.remove(); });
    $("ingRows").insertAdjacentHTML("beforeend", ls.map(l => ingRow(parseLine(l))).join(""));
    $("quickText").value = ""; $("quick").classList.add("hidden"); toast(`${ls.length} ingredienti aggiunti: controllali`);
  },
  addBimby: () => { $("bimbyRows").insertAdjacentHTML("beforeend", bimbyRow()); $("bimbyRows").lastElementChild.querySelector(".bt").focus(); },
  delBimby: b => b.closest(".brow").remove(),
  saveRecipe,
  delRecipe: () => {
    if (!confirm("Vuoi davvero eliminare questa ricetta?")) return;
    db.recipes = db.recipes.filter(r => r.id !== state.rid);
    db.menus.forEach(m => m.items = m.items.filter(id => id !== state.rid));
    save(); toast("Ricetta eliminata"); go("list", { rid: null }, "replace");
  },
  newMenu: () => go("menuEdit", { mid: null }),
  openMenu: b => go("menu", { mid: b.dataset.id, persons: null }),
  editMenu: () => go("menuEdit", { mid: state.mid }),
  saveMenu: () => {
    const name = $("mName").value.trim();
    if (!name) { toast("Dai un nome al menu"); $("mName").focus(); return; }
    const data = { name, serv: parseInt($("mServ").value) || 4, items: [...document.querySelectorAll(".mchk:checked")].map(c => c.value) };
    let m = getM(state.mid);
    if (m) Object.assign(m, data); else { m = { id: uid(), ...data }; db.menus.push(m); }
    save(); toast("Menu salvato"); go("menu", { mid: m.id, persons: null }, "replace");
  },
  delMenu: () => {
    if (!confirm("Vuoi davvero eliminare questo menu? Le ricette restano.")) return;
    db.menus = db.menus.filter(m => m.id !== state.mid); save(); go("menus", { mid: null }, "replace");
  },
  addShopMenu: () => {
    const m = getM(state.mid), p = state.persons || m.serv;
    addToShop(m.items.map(getR).filter(Boolean).flatMap(r => scaled(r, p, "orig")), m.name);
  },
  check: b => {
    const x = db.shop.find(s => s.id === b.dataset.id); x.done = !x.done; save(); render(false);
    if (x.done && db.shop.every(s => s.done)) { window.scrollTo({ top: 0, behavior: "smooth" }); toast("Spesa completata"); }
  },
  clearDone: () => { db.shop = db.shop.filter(x => !x.done); save(); render(false); },
  clearAll: () => { if (confirm("Svuotare tutta la lista della spesa?")) { db.shop = []; save(); render(false); } },
  shopAdd: () => {
    const v = $("shopAdd").value.trim(); if (!v) return;
    db.shop.push({ id: uid(), ...parseLine(v), done: false }); save(); render(false); $("shopAdd").focus();
  },
  export: exportData,
  import: () => $("fileImport").click(),
  login: async () => {
    try { await cloud.A.signInWithPopup(cloud.auth, new cloud.A.GoogleAuthProvider()); }
    catch (e) {
      if (e.code === "auth/popup-blocked") toast("Il browser ha bloccato la finestra di accesso: consentila e riprova");
      else if (!["auth/popup-closed-by-user", "auth/cancelled-popup-request"].includes(e.code)) toast("Accesso non riuscito: riprova");
    }
  },
  logout: () => {
    if (!confirm("Vuoi uscire? Le ricette restano su questo dispositivo, ma non si aggiornano più con la famiglia.")) return;
    cloud.A.signOut(cloud.auth);
  },
  createFamily: async () => {
    const u = cloud.user, F = cloud.F, e = u.email.toLowerCase();
    try { await F.setDoc(F.doc(cloud.fs, "config", "accesso"), { proprietario: u.uid, proprietarioEmail: e, email: [e] }); toast("Ricettario di famiglia creato"); connect(); }
    catch { toast("Non riesco a creare il ricettario di famiglia: riprova"); }
  },
  addMember: async () => {
    const v = $("memberEmail").value.trim().toLowerCase(), list = cloud.access.email || [];
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { toast("Scrivi un indirizzo email valido"); return; }
    if (list.includes(v)) { toast("È già nella famiglia"); return; }
    $("memberEmail").blur();
    await setMembers([...list, v]); toast("Aggiunto: ora può entrare con questo account Google");
  },
  delMember: b => {
    if (!confirm(`Togliere ${b.dataset.e} dalla famiglia?`)) return;
    setMembers(cloud.access.email.filter(x => x !== b.dataset.e));
  }
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b, e);
});
document.addEventListener("input", e => {
  if (e.target.dataset.in === "search") { state.q = e.target.value; fillResults(); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.in;
  if (k === "note") { getR(state.rid).notes = e.target.value.trim(); save(); toast("Nota salvata"); }
  if (k === "phone") { db.settings.phone = e.target.value.trim(); save(); toast("Numero salvato"); }
  if (e.target.id === "fileImport" && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "shopAdd") actions.shopAdd();
  if (e.key === "Enter" && e.target.id === "memberEmail") actions.addMember();
});

history.replaceState({ view: "list" }, "");
save();
render(true);
cloudInit();
</script>
