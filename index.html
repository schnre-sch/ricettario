<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf6f0">
<title>Il mio Ricettario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf6f0; --surface: #ffffff; --surface-2: #f3ece3; --text: #2a211c; --muted: #7d6f65;
    --accent: #c65d33; --accent-soft: #f7e4d9; --green: #5f7a4a; --green-soft: #e6eedc;
    --border: #ebe2d8; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(60,40,20,.05), 0 6px 18px rgba(60,40,20,.07);
    --c-Antipasti: #6d8f4e; --c-Primi: #d39b2a; --c-Secondi: #b5523b; --c-Dolci: #c0607f; --c-Altro: #8a7a6e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1714; --surface: #26201c; --surface-2: #302823; --text: #f2ebe4; --muted: #a99b90;
      --accent: #e8794a; --accent-soft: #3d2a20; --green: #9cbd7f; --green-soft: #2c3524;
      --border: #3a312b; --danger: #f2827a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1, h2, h3 { font-family: Fraunces, Georgia, serif; font-weight: 700; letter-spacing: -.01em; }
  h1 { font-size: 1.9rem; margin: 8px 0 14px; }
  h2 { font-size: 1.6rem; margin: 6px 0 6px; line-height: 1.2; }
  h3 { font-size: 1.15rem; margin: 0 0 10px; }
  .view { animation: enter .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { .view, .card, .toast { animation: none !important; transition: none !important; } }

  input, select, textarea { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 11px 12px; width: 100%; transition: border-color .2s, box-shadow .2s; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { min-height: 100px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; background: var(--surface-2);
    color: var(--text); transition: transform .12s, background .2s, opacity .2s; }
  button:active { transform: scale(.96); }
  .primary { background: var(--accent); color: #fff; font-weight: 600; }
  .ghost { background: transparent; }
  .danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .small { padding: 7px 12px; font-size: .9rem; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  .topbar { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .topbar .grow { flex: 1; }
  .iconbtn { background: var(--surface); box-shadow: var(--shadow); width: 42px; height: 42px; padding: 0; border-radius: 50%; font-size: 1.1rem; }

  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { white-space: nowrap; padding: 7px 14px; border-radius: 999px; font-size: .9rem; background: var(--surface); border: 1px solid var(--border); }
  .chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }

  .grid { display: grid; gap: 12px; margin-top: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); cursor: pointer;
    display: flex; gap: 12px; align-items: center; transition: transform .15s; animation: enter .35s both; }
  .card:active { transform: scale(.98); }
  .badge { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-size: 1.5rem; flex-shrink: 0;
    background: color-mix(in srgb, var(--cc) 18%, transparent); }
  .card h3 { margin: 0 0 2px; font-size: 1.05rem; }
  .meta { color: var(--muted); font-size: .88rem; display: flex; gap: 10px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; }
  .empty div { font-size: 2.6rem; margin-bottom: 6px; }

  .panel { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .catpill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600;
    color: var(--cc); background: color-mix(in srgb, var(--cc) 15%, transparent); }

  .stepper { display: flex; align-items: center; gap: 12px; }
  .stepper button { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 1.3rem; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .stepper b { font-size: 1.3rem; min-width: 28px; text-align: center; }

  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; margin-top: 14px; }
  .seg button { flex: 1; padding: 9px 6px; border-radius: 9px; background: transparent; font-weight: 500; font-size: .95rem; }
  .seg button.on { background: var(--surface); box-shadow: var(--shadow); color: var(--accent); font-weight: 600; }

  .ing { list-style: none; padding: 0; margin: 0; }
  .ing li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--border); align-items: baseline; }
  .ing li:last-child { border-bottom: 0; }
  .ing .q { font-weight: 600; min-width: 72px; }
  .ing .k { margin-left: auto; color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .swap { display: block; color: var(--green); font-size: .82rem; }
  .total { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 10px; padding: 12px 14px;
    border-radius: 12px; background: var(--green-soft); color: var(--text); font-weight: 600; }
  .note-unknown { font-size: .82rem; color: var(--muted); margin-top: 6px; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { background: var(--surface-2); padding: 6px 12px; border-radius: 999px; font-size: .9rem; }
  ol.steps { padding: 0; margin: 0; list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 14px 42px; }
  ol.steps li::before { content: counter(s); position: absolute; left: 0; top: -2px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); font-weight: 700; display: grid; place-items: center; font-size: .9rem; }
  .bset { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .bset span { font-size: .82rem; background: var(--green-soft); color: var(--green); padding: 3px 9px; border-radius: 999px; font-weight: 600; }

  label { display: block; font-weight: 600; margin: 16px 0 6px; font-size: .95rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .irow { display: grid; grid-template-columns: 74px 110px 1fr 36px; gap: 6px; margin-bottom: 6px; animation: enter .25s; }
  .irow button, .brow .x { padding: 0; background: transparent; color: var(--muted); font-size: 1.1rem; }
  @media (max-width: 420px) { .irow { grid-template-columns: 62px 96px 1fr 30px; } .irow input, .irow select { padding: 10px 8px; } }
  .brow { background: var(--surface-2); border-radius: 14px; padding: 10px; margin-bottom: 8px; animation: enter .25s; }
  .brow textarea { min-height: 54px; }
  .brow .three { display: grid; grid-template-columns: 1fr 1fr 1fr 36px; gap: 6px; margin-top: 6px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }

  .fab { position: fixed; right: max(16px, calc(50% - 364px)); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 6;
    width: 58px; height: 58px; border-radius: 50%; font-size: 1.8rem; padding: 0; background: var(--accent); color: #fff;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 45%, transparent); }

  .shop li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; transition: opacity .25s; }
  .shop li:last-child { border-bottom: 0; }
  .shop .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border); display: grid; place-items: center;
    flex-shrink: 0; transition: all .2s; color: transparent; font-weight: 700; }
  .shop li.done { opacity: .5; }
  .shop li.done .box { background: var(--green); border-color: var(--green); color: #fff; }
  .shop li.done .t { text-decoration: line-through; }
  .shop .t { flex: 1; }
  .shop .qq { color: var(--muted); font-size: .9rem; white-space: nowrap; }
  .progress { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
  .progress div { height: 100%; background: var(--green); transition: width .4s; }

  .mlist label { display: flex; gap: 10px; align-items: center; font-weight: 400; margin: 0; padding: 10px 2px; border-bottom: 1px solid var(--border); }
  .mlist input { width: 20px; height: 20px; accent-color: var(--accent); }
  .course { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .course:last-child { border-bottom: 0; }

  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border);
    display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { flex: 1; max-width: 160px; background: transparent; display: flex; flex-direction: column; align-items: center;
    gap: 1px; font-size: .75rem; color: var(--muted); padding: 6px 4px; position: relative; }
  nav.tabs button span { font-size: 1.35rem; line-height: 1.2; transition: transform .2s; }
  nav.tabs button.on { color: var(--accent); font-weight: 600; }
  nav.tabs button.on span { transform: translateY(-2px) scale(1.1); }
  .count { position: absolute; top: 2px; left: calc(50% + 8px); background: var(--accent); color: #fff; font-size: .7rem;
    min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 5px; font-weight: 700; }

  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 999px; font-size: .92rem; opacity: 0;
    pointer-events: none; transition: all .3s; z-index: 9; max-width: calc(100% - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<main id="view" class="wrap"></main>
<nav class="tabs" id="tabs">

  <button data-act="tab" data-v="menus"><span>🍽️</span>Menu</button>
  <button data-act="tab" data-v="shop"><span>🛒</span>Spesa<i class="count hidden" id="shopCount"></i></button>

</nav>
<div class="toast" id="toast"></div>

const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[’`]/g, "'").trim();

// ---------- Stato e salvataggio ----------
const $ = id => document.getElementById(id);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const lines = s => s.split("\n").map(x => x.trim()).filter(Boolean);

let db = load();
let state = { view: "list", cat: "Tutte", q: "", rid: null, mid: null, persons: null, ver: "orig", proc: "std" };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return { recipes: [], menus: [], shop: [], settings: {}, ...JSON.parse(raw) };
    const old = localStorage.getItem(OLD_KEY); // versione precedente: la converto, l'originale resta intatto
    if (old) return { recipes: JSON.parse(old).map(migrate), menus: [], shop: [], settings: {} };
  } catch (e) {}
  return { recipes: [example()], menus: [], shop: [], settings: {} };

// ---------- Ingredienti, porzioni e calorie ----------
function parseLine(s) {
  s = s.trim();
  const qb = /\s*\bq\.?\s?b\.?\s*$/i;
  if (qb.test(s)) return { qty: null, unit: "qb", name: s.replace(qb, "").trim() || s };
  const t = s.split(/\s+/);
  let qty = null, unit = "qb";
  const m = t[0] && t[0].match(/^(\d+(?:[.,]\d+)?|\d+\/\d+)([a-zA-Z]*)$/);
  if (m) {
    qty = toNum(m[1]); unit = "pz"; t.shift();
    if (m[2]) t.unshift(m[2]);
    const w = t.length > 1 ? norm(t[0]).replace(/\.$/, "") : "";
    if (UNIT_WORDS[w]) { unit = UNIT_WORDS[w]; t.shift(); if (unit === "cl") { unit = "ml"; qty *= 10; } }
  }
  const name = t.join(" ").replace(/^di\s+/i, "").replace(/^d['’]\s*/i, "");
  return { qty, unit, name: name || s };
}
function toNum(v) {
  v = String(v ?? "").replace(",", ".").trim();
  if (!v) return null;
  const n = v.includes("/") ? v.split("/")[0] / v.split("/")[1] : parseFloat(v);
  return isFinite(n) && n > 0 ? n : null;
}
function findFood(name) {
  const n = norm(name); let best = null, bl = 0;
  for (const f of FOOD) for (const p of f.pats) if (p.length > bl && n.includes(p)) { best = f; bl = p.length; }
  return best;
}
function kcalOf(i) {
  if (i.unit === "qb") return 0;
  const f = findFood(i.name);
  if (!f || !(i.qty > 0)) return null;
  const g = i.unit === "pz" ? (f.pz ? i.qty * f.pz : null) : i.qty * (UNIT_G[i.unit] ?? 1);
  return g == null ? null : g * f.kcal / 100;
}
function applyVer(i, ver) {
  if (ver === "orig" || i.unit === "qb") return { ...i };
  const f = findFood(i.name), s = f && SUBS[f.id] && SUBS[f.id][ver];
  if (!s || (!s.to && i.qty == null)) return { ...i };
  const o = { ...i };
  if (s.to) { o.name = s.to; o.was = i.name; }
  if (s.f && s.f !== 1 && o.qty != null) { o.qty = i.qty * s.f; o.reduced = true; }
  return o;
}
function scaled(r, persons, ver) {
  const k = persons / (r.serv || persons);
  return r.ing.map(i => { const o = applyVer(i, ver); if (o.qty != null) o.qty *= k; return o; });
}
function kcalSum(list) {
  let total = 0, unknown = 0;
  for (const i of list) { const k = kcalOf(i); if (k == null) unknown++; else total += k; }
  return { total, unknown };
}
const perPerson = r => Math.round(kcalSum(r.ing).total / (r.serv || 1));
function fmtQty(q) {
  if (q == null) return "";
  const v = q >= 100 ? Math.round(q / 5) * 5 : q >= 10 ? Math.round(q) : q >= 1 ? Math.round(q * 10) / 10 : Math.round(q * 100) / 100;
  return String(v).replace(".", ",");
}
function fmtAmount(i) {
  if (i.unit === "qb" || i.qty == null) return "q.b.";
  const u = i.unit === "pz" ? "" : (i.qty > 1 && PLURAL[i.unit]) || i.unit;
  return (fmtQty(i.qty) + " " + u).trim();
}

// ---------- Navigazione ----------
function go(view, params = {}, mode = "push") {
  Object.assign(state, { view }, params);
  const snap = { view: state.view, rid: state.rid, mid: state.mid, persons: state.persons, ver: state.ver, proc: state.proc };
  if (mode === "push") history.pushState(snap, "");
  else if (mode === "replace") history.replaceState(snap, "");
  render(true);
}
window.onpopstate = e => { Object.assign(state, e.state || { view: "list" }); render(true); };
const back = () => history.length > 1 ? history.back() : go("list", {}, "replace");

function render(animate) {
  const v = $("view");
  const views = { list: viewList, detail: viewDetail, edit: viewEdit, menus: viewMenus, menu: viewMenu, menuEdit: viewMenuEdit, shop: viewShop, settings: viewSettings };
  v.innerHTML = (views[state.view] || viewList)();
  if (animate) { v.classList.remove("view"); void v.offsetWidth; v.classList.add("view"); window.scrollTo(0, 0); }
  const tab = { list: "list", detail: "list", edit: "list", menus: "menus", menu: "menus", menuEdit: "menus", shop: "shop", settings: "settings" }[state.view];
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === tab));
  const left = db.shop.filter(x => !x.done).length;
  $("shopCount").textContent = left; $("shopCount").classList.toggle("hidden", !left);
  if (state.view === "list") fillResults();
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200);
}
const getR = id => db.recipes.find(r => r.id === id);
const getM = id => db.menus.find(m => m.id === id);

function addToShop(list, from) {
  let n = 0;
  for (const i of list) {
    const key = norm(i.name) + "|" + i.unit;
    const ex = db.shop.find(x => norm(x.name) + "|" + x.unit === key && !x.done);
    if (ex) { if (ex.qty != null && i.qty != null) ex.qty += i.qty; }
    else db.shop.push({ id: uid(), name: i.name, qty: i.qty, unit: i.unit, done: false, from });
    n++;
  }
  save(); render(false); toast(`🛒 ${n} ingredienti aggiunti alla spesa`);
}
function viewShop() {
  const items = [...db.shop].sort((a, b) => a.done - b.done);
  const done = db.shop.filter(x => x.done).length;
  return `<h1>Lista della spesa</h1>
    ${items.length ? `<div class="muted">${done} di ${items.length} presi</div>
      <div class="progress"><div style="width:${items.length ? done / items.length * 100 : 0}%"></div></div>
      <div class="panel"><ul class="shop" style="list-style:none;margin:0;padding:0">${items.map(x => `
        <li class="${x.done ? "done" : ""}" data-act="check" data-id="${x.id}"><span class="box">✓</span>
          <span class="t">${esc(x.name)}${x.from ? `<div class="meta">${esc(x.from)}</div>` : ""}</span><span class="qq">${x.qty == null ? "" : esc(fmtAmount(x))}</span></li>`).join("")}</ul></div>
      <div class="bar"><button class="primary" data-act="sendWA">💬 Invia su WhatsApp</button>
        <button data-act="clearDone">Togli i presi</button><button class="ghost" data-act="clearAll">Svuota</button></div>
      ${db.settings.phone ? "" : `<p class="muted">Per inviare la lista imposta il numero in ⚙️ Altro.</p>`}`
    : `<div class="empty"><div>🛒</div>La lista è vuota.<br>Apri una ricetta o un menu e tocca "Aggiungi alla spesa".</div>`}
    <div class="panel"><h3>Aggiungi a mano</h3><div class="row"><input id="shopAdd" class="grow" placeholder="Es. 1 kg pane" style="flex:1;width:auto">
      <button data-act="shopAdd">＋</button></div></div>`;
}
function phoneDigits(p) {
  let s = String(p || "").replace(/[^\d+]/g, "");
  if (s.startsWith("+")) s = s.slice(1); else if (s.startsWith("00")) s = s.slice(2); else if (/^3\d{8,9}$/.test(s)) s = "39" + s;
  return s.replace(/\D/g, "");
}
function sendWA() {
  const d = phoneDigits(db.settings.phone);
  if (!d) { toast("Prima imposta il numero di WhatsApp"); go("settings"); return; }
  const all = db.shop.length && db.shop.every(x => x.done);
  const txt = (all ? "✅ Spesa fatta!\n\n" : "🛒 Lista della spesa\n\n") +
    [...db.shop].sort((a, b) => a.done - b.done).map(x => `${x.done ? "✅" : "⬜"} ${x.name}${x.qty == null ? "" : " — " + fmtAmount(x)}`).join("\n");
  window.open(`https://wa.me/${d}?text=${encodeURIComponent(txt)}`, "_blank");
}

// ---------- Impostazioni ----------
function viewSettings() {
  return `<h1>Altro</h1>
    <div class="panel"><h3>💬 Numero WhatsApp per la spesa</h3>
      <p class="muted" style="margin-top:0">A spesa finita, la lista viene preparata per questo numero. Tu tocchi solo "Invia" su WhatsApp.</p>
      <input id="phone" data-in="phone" type="tel" placeholder="Es. +39 333 1234567" value="${esc(db.settings.phone)}"></div>
    <div class="panel"><h3>💾 Copia di sicurezza</h3>
      <p class="muted" style="margin-top:0">Le ricette sono salvate su questo dispositivo. Scarica ogni tanto una copia: serve anche per spostarle su un altro telefono o computer.</p>
      <div class="row"><button data-act="export">⬇️ Scarica copia</button><button data-act="import">⬆️ Carica copia</button></div>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden"></div>
    <p class="muted" style="text-align:center;font-size:.85rem">Le calorie sono stime medie, da usare come indicazione.</p>`;
}
function exportData() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "ricettario", version: 2, ...db }, null, 2)], { type: "application/json" }));
  a.download = `ricettario-${p(d.getDate())}-${p(d.getMonth() + 1)}-${d.getFullYear()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function importData(f) {
  try {
    const data = JSON.parse(await f.text());
    const rs = (Array.isArray(data) ? data : data.recipes || []).filter(r => r && r.title).map(migrate);
    const ms = Array.isArray(data) ? [] : (data.menus || []);
    if (!rs.length && !ms.length) throw 0;
    if (!confirm(`Trovate ${rs.length} ricette e ${ms.length} menu. Le aggiungo a quelle che hai già?`)) return;
    const ids = new Set(db.recipes.map(r => r.id)), mids = new Set(db.menus.map(m => m.id));
    const newR = rs.filter(r => !ids.has(r.id)), newM = ms.filter(m => m && m.id && !mids.has(m.id));
    db.recipes.push(...newR); db.menus.push(...newM);
    save(); render(false); toast(`Aggiunte ${newR.length} ricette e ${newM.length} menu`);
  } catch { toast("Questo file non sembra una copia del ricettario"); }
}

// ---------- Azioni ----------
const actions = {
  tab: b => go(b.dataset.v, { persons: null }),
  back,
  cat: b => { state.cat = b.dataset.c; render(false); },
  newRecipe: () => go("edit", { rid: null }),
  openRecipe: b => go("detail", { rid: b.dataset.id, persons: null, ver: "orig", proc: "std" }),
  editRecipe: () => go("edit", { rid: state.rid }),
  fav: () => { const r = getR(state.rid); r.fav = !r.fav; save(); render(false); },
  pers: b => {
    const base = state.view === "menu" ? getM(state.mid).serv : getR(state.rid).serv;
    state.persons = Math.max(1, Math.min(50, (state.persons || base) + +b.dataset.d));
    history.replaceState({ ...history.state, persons: state.persons }, ""); render(false);
  },
  ver: b => { state.ver = b.dataset.v; history.replaceState({ ...history.state, ver: state.ver }, ""); render(false); },
  proc: b => { state.proc = b.dataset.v; history.replaceState({ ...history.state, proc: state.proc }, ""); render(false); },
  addShop: () => { const r = getR(state.rid); addToShop(scaled(r, state.persons || r.serv, state.ver), r.title); },
  addRow: () => { $("ingRows").insertAdjacentHTML("beforeend", ingRow()); $("ingRows").lastElementChild.querySelector(".iq").focus(); },
  delRow: b => b.closest(".irow").remove(),
  toggleQuick: () => $("quick").classList.toggle("hidden"),
  addQuick: () => {
    const ls = lines($("quickText").value); if (!ls.length) return;
    document.querySelectorAll("#ingRows .irow").forEach(row => { if (!row.querySelector(".in").value.trim()) row.remove(); });
    $("ingRows").insertAdjacentHTML("beforeend", ls.map(l => ingRow(parseLine(l))).join(""));
    $("quickText").value = ""; $("quick").classList.add("hidden"); toast(`${ls.length} ingredienti aggiunti: controllali`);
  },
  addBimby: () => { $("bimbyRows").insertAdjacentHTML("beforeend", bimbyRow()); $("bimbyRows").lastElementChild.querySelector(".bt").focus(); },
  delBimby: b => b.closest(".brow").remove(),
  saveRecipe,
  delRecipe: () => {
    if (!confirm("Vuoi davvero eliminare questa ricetta?")) return;
    db.recipes = db.recipes.filter(r => r.id !== state.rid);
    db.menus.forEach(m => m.items = m.items.filter(id => id !== state.rid));
    save(); toast("Ricetta eliminata"); go("list", { rid: null }, "replace");
  },
  newMenu: () => go("menuEdit", { mid: null }),
  openMenu: b => go("menu", { mid: b.dataset.id, persons: null }),
  editMenu: () => go("menuEdit", { mid: state.mid }),
  saveMenu: () => {
    const name = $("mName").value.trim();
    if (!name) { toast("Dai un nome al menu"); $("mName").focus(); return; }
    const data = { name, serv: parseInt($("mServ").value) || 4, items: [...document.querySelectorAll(".mchk:checked")].map(c => c.value) };
    let m = getM(state.mid);
    if (m) Object.assign(m, data); else { m = { id: uid(), ...data }; db.menus.push(m); }
    save(); toast("Menu salvato ✓"); go("menu", { mid: m.id, persons: null }, "replace");
  },
  delMenu: () => {
    if (!confirm("Vuoi davvero eliminare questo menu? Le ricette restano.")) return;
    db.menus = db.menus.filter(m => m.id !== state.mid); save(); go("menus", { mid: null }, "replace");
  },
  addShopMenu: () => {
    const m = getM(state.mid), p = state.persons || m.serv;
    addToShop(m.items.map(getR).filter(Boolean).flatMap(r => scaled(r, p, "orig")), m.name);
  },
  check: b => {
    const x = db.shop.find(s => s.id === b.dataset.id); x.done = !x.done; save(); render(false);
    if (x.done && db.shop.every(s => s.done) && confirm("Spesa completata! 🎉\nVuoi inviare la lista su WhatsApp?")) sendWA();
  },
  sendWA,
  clearDone: () => { db.shop = db.shop.filter(x => !x.done); save(); render(false); },
  clearAll: () => { if (confirm("Svuotare tutta la lista della spesa?")) { db.shop = []; save(); render(false); } },
  shopAdd: () => {
    const v = $("shopAdd").value.trim(); if (!v) return;
    const i = parseLine(v); db.shop.push({ id: uid(), ...i, done: false }); save(); render(false);
  },
  export: exportData,
  import: () => $("fileImport").click()
};
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (b && actions[b.dataset.act]) actions[b.dataset.act](b, e);
});
document.addEventListener("input", e => {
  const k = e.target.dataset.in;
  if (k === "search") { state.q = e.target.value; fillResults(); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.in;
  if (k === "note") { getR(state.rid).notes = e.target.value.trim(); save(); toast("Nota salvata ✓"); }
  if (k === "phone") { db.settings.phone = e.target.value.trim(); save(); toast("Numero salvato ✓"); }
  if (e.target.id === "fileImport" && e.target.files[0]) { importData(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "shopAdd") actions.shopAdd();
});

history.replaceState({ view: "list" }, "");
save();
render(true);
</script>
</body>
</html>
