<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il mio Ricettario</title>
<style>
  :root {
    --bg: #fbf7f2; --card: #ffffff; --text: #2b2420; --muted: #7a6e66;
    --accent: #c0562b; --accent-soft: #f6e3d8; --border: #e8ded5; --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --card: #27221f; --text: #f1ebe5; --muted: #a89c92;
      --accent: #e8794a; --accent-soft: #3a2a22; --border: #3a332e; --danger: #f2827a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 .sp { flex: 1; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 110px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer;
    background: var(--accent-soft); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  button.icon { padding: 8px 10px; background: transparent; font-size: 1.2rem; }
  main { padding: 16px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; }
  .chip { white-space: nowrap; padding: 6px 12px; border-radius: 999px; font-size: .9rem;
    background: var(--card); border: 1px solid var(--border); }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .list { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; }
  .card h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .meta { color: var(--muted); font-size: .9rem; display: flex; gap: 12px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .detail h2 { margin: 4px 0 6px; font-size: 1.5rem; }
  .detail h4 { margin: 18px 0 6px; color: var(--accent); }
  .detail ul, .detail ol { margin: 0; padding-left: 22px; }
  .detail li { margin: 4px 0; }
  .detail p { white-space: pre-wrap; margin: 0; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; font-size: .95rem; }
  .hint { font-weight: 400; color: var(--muted); font-size: .85rem; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .hidden { display: none !important; }
  .menu { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; }
  .menu p { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>🍝 Il mio Ricettario <span class="sp"></span>
      <button class="icon" id="btnMenu" title="Copia di sicurezza">⚙️</button>
    </h1>
    <div class="row" id="searchRow">
      <input id="search" type="search" placeholder="Cerca una ricetta o un ingrediente…">
    </div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap">
  <!-- Copia di sicurezza -->
  <section id="menu" class="menu hidden">
    <p>Le ricette sono salvate su questo dispositivo. Ogni tanto scarica una copia di sicurezza: ti serve anche per spostare le ricette su un altro telefono o computer.</p>
    <div class="row">
      <button id="btnExport">⬇️ Scarica copia</button>
      <button id="btnImport">⬆️ Carica copia</button>
      <input type="file" id="fileImport" accept=".json,application/json" class="hidden">
    </div>
  </section>

  <!-- Elenco -->
  <section id="viewList">
    <div class="list" id="list"></div>
    <div class="bar"><button class="primary" id="btnNew">＋ Nuova ricetta</button></div>
  </section>

  <!-- Dettaglio -->
  <section id="viewDetail" class="detail hidden"></section>

  <!-- Modifica -->
  <section id="viewEdit" class="hidden">
    <h2 id="editTitle">Nuova ricetta</h2>
    <label>Nome</label>
    <input id="fTitle" placeholder="Es. Lasagne della nonna">
    <label>Categoria</label>
    <input id="fCat" list="catList" placeholder="Es. Primi, Dolci…">
    <datalist id="catList"></datalist>
    <div class="row">
      <div style="flex:1;min-width:140px"><label>Tempo</label><input id="fTime" placeholder="Es. 45 minuti"></div>
      <div style="flex:1;min-width:140px"><label>Persone</label><input id="fServ" placeholder="Es. 4"></div>
    </div>
    <label>Ingredienti <span class="hint">(uno per riga)</span></label>
    <textarea id="fIng" placeholder="300 g di farina&#10;3 uova"></textarea>
    <label>Preparazione <span class="hint">(un passaggio per riga)</span></label>
    <textarea id="fSteps" placeholder="Impasta la farina con le uova&#10;Lascia riposare 30 minuti"></textarea>
    <label>Note</label>
    <textarea id="fNotes" style="min-height:70px" placeholder="Consigli, varianti…"></textarea>
    <div class="bar">
      <button class="primary" id="btnSave">Salva</button>
      <button id="btnCancel">Annulla</button>
      <span style="flex:1"></span>
      <button class="danger hidden" id="btnDelete">Elimina</button>
    </div>
  </section>
</main>

<script>
const KEY = "ricettario.v1";
const $ = id => document.getElementById(id);
let recipes = load();
let filterCat = "Tutte";
let currentId = null;

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return [{
    id: uid(), title: "Spaghetti aglio, olio e peperoncino", cat: "Primi",
    time: "15 minuti", serv: "2", fav: false,
    ing: ["200 g di spaghetti", "2 spicchi d'aglio", "Olio extravergine", "1 peperoncino", "Prezzemolo"],
    steps: ["Cuoci gli spaghetti in acqua salata", "In padella scalda l'olio con aglio e peperoncino", "Scola la pasta e saltala in padella", "Aggiungi il prezzemolo e servi"],
    notes: "Ricetta di esempio: puoi modificarla o eliminarla."
  }];
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(recipes)); }
  catch (e) { alert("Attenzione: non riesco a salvare su questo dispositivo."); }
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function lines(s) { return s.split("\n").map(x => x.trim()).filter(Boolean); }
function cats() { return [...new Set(recipes.map(r => r.cat).filter(Boolean))].sort((a, b) => a.localeCompare(b, "it")); }

function show(view) {
  for (const v of ["viewList", "viewDetail", "viewEdit"]) $(v).classList.toggle("hidden", v !== view);
  const inList = view === "viewList";
  $("searchRow").classList.toggle("hidden", !inList);
  $("chips").classList.toggle("hidden", !inList);
  window.scrollTo(0, 0);
}

function renderChips() {
  const all = ["Tutte", "⭐ Preferite", ...cats()];
  if (!all.includes(filterCat)) filterCat = "Tutte";
  $("chips").innerHTML = all.map(c => `<button class="chip ${c === filterCat ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("catList").innerHTML = cats().map(c => `<option value="${esc(c)}">`).join("");
}

function renderList() {
  renderChips();
  const q = $("search").value.trim().toLowerCase();
  const items = recipes
    .filter(r => filterCat === "Tutte" || (filterCat === "⭐ Preferite" ? r.fav : r.cat === filterCat))
    .filter(r => !q || [r.title, r.cat, r.notes, ...r.ing].join(" ").toLowerCase().includes(q))
    .sort((a, b) => a.title.localeCompare(b.title, "it"));
  $("list").innerHTML = items.length ? items.map(r => `
    <div class="card" data-id="${r.id}">
      <h3>${r.fav ? "⭐ " : ""}${esc(r.title)}</h3>
      <div class="meta">${r.cat ? `<span>📂 ${esc(r.cat)}</span>` : ""}${r.time ? `<span>⏱️ ${esc(r.time)}</span>` : ""}${r.serv ? `<span>👥 ${esc(r.serv)}</span>` : ""}</div>
    </div>`).join("")
    : `<div class="empty">${recipes.length ? "Nessuna ricetta trovata." : "Ancora nessuna ricetta. Aggiungi la prima!"}</div>`;
}

function openDetail(id) {
  const r = recipes.find(x => x.id === id); if (!r) return;
  currentId = id;
  $("viewDetail").innerHTML = `
    <div class="row"><button id="dBack">← Indietro</button><span style="flex:1"></span>
      <button id="dFav">${r.fav ? "⭐ Preferita" : "☆ Preferita"}</button><button class="primary" id="dEdit">✏️ Modifica</button></div>
    <h2>${esc(r.title)}</h2>
    <div class="meta">${r.cat ? `<span>📂 ${esc(r.cat)}</span>` : ""}${r.time ? `<span>⏱️ ${esc(r.time)}</span>` : ""}${r.serv ? `<span>👥 ${esc(r.serv)} persone</span>` : ""}</div>
    ${r.ing.length ? `<h4>Ingredienti</h4><ul>${r.ing.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
    ${r.steps.length ? `<h4>Preparazione</h4><ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${r.notes ? `<h4>Note</h4><p>${esc(r.notes)}</p>` : ""}`;
  $("dBack").onclick = () => { show("viewList"); renderList(); };
  $("dEdit").onclick = () => openEdit(id);
  $("dFav").onclick = () => { r.fav = !r.fav; save(); openDetail(id); };
  show("viewDetail");
}

function openEdit(id) {
  const r = recipes.find(x => x.id === id);
  currentId = r ? id : null;
  $("editTitle").textContent = r ? "Modifica ricetta" : "Nuova ricetta";
  $("fTitle").value = r?.title ?? "";
  $("fCat").value = r?.cat ?? "";
  $("fTime").value = r?.time ?? "";
  $("fServ").value = r?.serv ?? "";
  $("fIng").value = (r?.ing ?? []).join("\n");
  $("fSteps").value = (r?.steps ?? []).join("\n");
  $("fNotes").value = r?.notes ?? "";
  $("btnDelete").classList.toggle("hidden", !r);
  renderChips();
  show("viewEdit");
  $("fTitle").focus();
}

$("btnSave").onclick = () => {
  const title = $("fTitle").value.trim();
  if (!title) { alert("Scrivi almeno il nome della ricetta."); return; }
  const data = { title, cat: $("fCat").value.trim(), time: $("fTime").value.trim(), serv: $("fServ").value.trim(),
    ing: lines($("fIng").value), steps: lines($("fSteps").value), notes: $("fNotes").value.trim() };
  let r = recipes.find(x => x.id === currentId);
  if (r) Object.assign(r, data);
  else { r = { id: uid(), fav: false, ...data }; recipes.push(r); }
  save(); openDetail(r.id);
};
$("btnCancel").onclick = () => currentId ? openDetail(currentId) : (show("viewList"), renderList());
$("btnDelete").onclick = () => {
  if (!confirm("Vuoi davvero eliminare questa ricetta?")) return;
  recipes = recipes.filter(x => x.id !== currentId); currentId = null;
  save(); show("viewList"); renderList();
};
$("btnNew").onclick = () => openEdit(null);
$("search").oninput = renderList;
$("chips").onclick = e => { const c = e.target.closest(".chip"); if (c) { filterCat = c.dataset.c; renderList(); } };
$("list").onclick = e => { const c = e.target.closest(".card"); if (c) openDetail(c.dataset.id); };
$("btnMenu").onclick = () => $("menu").classList.toggle("hidden");

$("btnExport").onclick = () => {
  const d = new Date();
  const name = `ricettario-${String(d.getDate()).padStart(2, "0")}-${String(d.getMonth() + 1).padStart(2, "0")}-${d.getFullYear()}.json`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(recipes, null, 2)], { type: "application/json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
};
$("btnImport").onclick = () => $("fileImport").click();
$("fileImport").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!Array.isArray(data)) throw 0;
    if (!confirm(`Trovate ${data.length} ricette. Le aggiungo a quelle che hai già?`)) return;
    const ids = new Set(recipes.map(r => r.id));
    let added = 0;
    for (const r of data) if (r && r.title && !ids.has(r.id)) {
      recipes.push({ fav: false, cat: "", time: "", serv: "", notes: "", ...r,
        ing: Array.isArray(r.ing) ? r.ing : [], steps: Array.isArray(r.steps) ? r.steps : [],
        id: r.id || uid() });
      added++;
    }
    save(); renderList(); alert(`Fatto! Aggiunte ${added} ricette (quelle che avevi già le ho saltate).`);
  } catch { alert("Questo file non sembra una copia del ricettario."); }
  e.target.value = "";
};

renderList();
</script>
</body>
</html>
